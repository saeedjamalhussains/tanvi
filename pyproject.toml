[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secplan"
version = "0.1.0"
description = "Open-source security strategy planner that works with any AI provider (bring your own API key)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "anthropic>=2.0",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
secplan = "secplan.cli:main"

[tool.setuptools.packages.find]
include = ["secplan*"]

[tool.setuptools.package-data]
secplan = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
